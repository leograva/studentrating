{% extends 'base.html' %}
{% block content %}

<h3 class="text-center">Cadastro de Alunos</h3>

<form method="POST">
  {% csrf_token %}

  <!-- NOME -->
  <div class="form-group">
    <label>Nome</label>
    <input
      type="text"
      name="nome"
      class="form-control"
      placeholder="Digite o nome do aluno"
      required
    >
  </div>

  <br>

  <!-- TURMA -->
  <div class="form-group">
    <label>Turma</label>
    <select name="turma" class="form-control" required>
      <option value="">Selecione a turma</option>
      {% for turma in lista_turmas %}
        <option value="{{ turma.id }}">{{ turma.nome }}</option>
      {% endfor %}
    </select>
  </div>

  <br>

  <!-- RESPONSÁVEL -->
  <div class="form-group">
    <label>Responsável</label>
    <select name="responsavel" class="form-control" required>
      <option value="">Selecione o responsável</option>
      {% for r in lista_responsaveis %}
        <option value="{{ r.id }}">{{ r.nome }}</option>
      {% endfor %}
    </select>
  </div>

  <br>

  <button type="submit" class="btn btn-primary">Cadastrar</button>
</form>

<hr>

<h4 class="text-center">Alunos Cadastrados</h4>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Nome</th>
      <th>Turma</th>
      <th>Responsável</th>
    </tr>
  </thead>
  <tbody>
    {% for aluno in lista_alunos %}
      <tr>
        <td>{{ aluno.nome }}</td>
        <td>{{ aluno.turma.nome }}</td>
        <td>{{ aluno.responsavel.nome }}</td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="3" class="text-center">Nenhum aluno cadastrado</td>
      </tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
